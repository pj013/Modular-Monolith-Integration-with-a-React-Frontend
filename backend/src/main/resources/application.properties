# Serialize LocalDateTime as an ISO-8601 string ("2026-09-10T20:15:00") instead of
# Jackson's default array form ([2026,9,10,20,15,0]) - much easier to consume in React.
spring.jackson.serialization.write-dates-as-timestamps=false